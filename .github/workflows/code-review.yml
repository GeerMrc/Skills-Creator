# Code Review Automation Workflow
#
# 此工作流在 Pull Request 时自动运行代码审查检查

name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码风格检查
  style:
    name: 代码风格检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  # 类型检查
  type-check:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mypy

      - name: Run mypy
        run: |
          mypy src/skill_creator_mcp

  # 单元测试
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/skill_creator_mcp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # 技能验证（本项目特有）
  skill-validation:
    name: 技能规范验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skill-creator-mcp
        run: |
          pip install -e .

      - name: Validate main skill
        run: |
          python -m skill_creator_mcp validate_skill . || true

      - name: Check SKILL.md format
        run: |
          # 检查 SKILL.md 是否超过 150 行
          LINES=$(wc -l < SKILL.md 2>/dev/null || echo "0")
          if [ "$LINES" -gt 500 ]; then
            echo "❌ SKILL.md 过长 ($LINES 行)，建议精简到 150 行以内"
            exit 1
          elif [ "$LINES" -gt 150 ]; then
            echo "⚠️ SKILL.md 较长 ($LINES 行)，建议精简到 150 行以内"
          fi

  # 安全检查
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r src/skill_creator_mcp/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # 代码复杂度检查
  complexity:
    name: 复杂度检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install radon

      - name: Run complexity analysis
        run: |
          radon cc src/skill_creator_mcp/ -a -nb

      - name: Check maintainability index
        run: |
          radon mi src/skill_creator_mcp/ -nb

  # 汇总结果
  review-summary:
    name: 审查汇总
    runs-on: ubuntu-latest
    needs: [style, type-check, test, skill-validation, security]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "### Code Review Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Style | ${{ needs.style.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.skill-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

          # 检查是否有失败的任务
          if [[ "${{ needs.style.result }}" == "failure" ]] || \
             [[ "${{ needs.type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.skill-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ 代码审查失败，请修复上述问题" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
