# Skills-Creator CI/CD 工作流
#
# 功能：
# - 代码质量检查 (Ruff + MyPy)
# - 单元测试和覆盖率报告 (pytest + pytest-cov)
# - 安全检查 (bandit)
# - 自动化代码审查

name: Code Review

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-creator-mcp

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          uv sync --dev

      - name: Ruff 代码检查
        run: |
          uv run ruff check .

      - name: Ruff 代码格式化检查
        run: |
          uv run ruff format --check .

      - name: MyPy 类型检查
        run: |
          uv run mypy src/

      - name: Bandit 安全检查
        run: |
          uv run bandit -r src/

  test:
    name: 测试和覆盖率
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-creator-mcp

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          uv sync --dev

      - name: 运行测试
        run: |
          uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: skill-creator-mcp/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    defaults:
      run:
        working-directory: skill-creator-mcp

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建包
        run: |
          uv build

      - name: 检查包内容
        run: |
          uv pip install --dry-run dist/*.whl
